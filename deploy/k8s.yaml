apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcel-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: parcel-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 0
  template:
    metadata:
      labels:
        app: parcel-api
    spec:
      containers:
        - name: parcel-api
          image: parcel-api:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: parcel-api
spec:
  selector:
    app: parcel-api
  ports:
    - port: 80
      targetPort: 8080
